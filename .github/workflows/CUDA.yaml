name: CUDA Build
on: [push, pull_request]

jobs:
  build-cuda:
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:12.2.2-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build with CMake
        run: |
          apt update
          apt install -y cmake
          cmake -B build -DODYSSEY_BACKEND=CUDA -DCMAKE_BUILD_TYPE=Release
          cmake --build build
